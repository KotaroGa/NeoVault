[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neovault"
version = "0.3.3"
description = "Secure file vault with CLI and encryption - Matrix Edition"
authors = [
    {name = "KotaroGa"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "cryptography>=42.0.0",
    "customtkinter>=5.2.0",
    "pycryptodome>=3.20.0",
    "pyperclip>=1.8.0",
    "argon2-cffi>=21.3.0",
    "qrcode>=7.0",
    "pillow>=10.0.0",
    "keyring>=24.0.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/KotaroGa/NeoVault"
Repository = "https://github.com/KotaroGa/NeoVault"
Issues = "https://github.com/KotaroGa/NeoVault/issues"

# ¡ESTA ES LA PARTE IMPORTANTE NUEVA!
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[project.scripts]
nvault = "cli.main:main"
nvault-gui = "gui.main_window:main"